name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run test
      - run: npm run build
        env:
          # Publishable Supabase values for the toolkit lead-capture form.
          # These are designed to ship in client code: demo_leads has an
          # insert-only RLS policy and no select policy, so this key can add a
          # lead and cannot read any back. Not secrets, deliberately not in
          # Actions secrets.
          VITE_SUPABASE_URL: https://gitwwldcuczklsgeegct.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_XwTaLxmGDa7d52lVMgpA8A_G3mzfUQl

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
