<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Schaefer TX — Technical Scientific Consulting</title>
    <script>
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      // GitHub Pages has no server-side rewrites, so a direct load of e.g.
      // /levey-jennings 404s. This encodes the real path into a query string
      // and redirects to the root, where index.html's inline script decodes
      // it back via history.replaceState before React Router reads the URL.
      var pathSegmentsToKeep = 0
      var l = window.location
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      )
    </script>
  </head>
  <body></body>
</html>
