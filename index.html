    <script>
      // Counterpart to public/404.html's redirect: restores the real path
      // (encoded as ?/path) via history.replaceState before React Router
      // mounts, so a direct load of e.g. /levey-jennings renders correctly.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&')
          }).join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
        }
      }(window.location))
    </script>
